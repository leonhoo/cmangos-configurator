    "key": "Rate.Creature.Elite.Elite.HP"
    "value": 1
  - "desc": "稀有精英（RAREELITE）等级生物的生命值倍率。例如：值为2时，生物生命值为原始值的2倍；值为1.7时，为原始值的1.7倍"
    "key": "Rate.Creature.Elite.RAREELITE.HP"
    "value": 1
  - "desc": "世界首领（WORLDBOSS）等级生物的生命值倍率。例如：值为2时，生物生命值为原始值的2倍；值为1.7时，为原始值的1.7倍"
    "key": "Rate.Creature.Elite.WORLDBOSS.HP"
