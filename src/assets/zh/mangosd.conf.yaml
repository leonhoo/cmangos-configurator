    "key": "Rate.Creature.Normal.SpellDamage"
    "value": 1
  - "desc": "精英（Elite）等级生物的法术伤害倍率。例如：值为2时，生物法术造成的伤害为原始值的2倍；值为1.7时，为原始值的1.7倍"
    "key": "Rate.Creature.Elite.Elite.SpellDamage"
    "value": 1
  - "desc": "稀有精英（RAREELITE）等级生物的法术伤害倍率。例如：值为2时，生物法术造成的伤害为原始值的2倍；值为1.7时，为原始值的1.7倍"
    "key": "Rate.Creature.Elite.RAREELITE.SpellDamage"
    "value": 1
  - "desc": "世界首领（WORLDBOSS）等级生物的法术伤害倍率。例如：值为2时，生物法术造成的伤害为原始值的2倍；值为1.7时，为原始值的1.7倍"
    "key": "Rate.Creature.Elite.WORLDBOSS.SpellDamage"
    "value": 1
  - "desc": "稀有（RARE）等级生物的法术伤害倍率。例如：值为2时，生物法术造成的伤害为原始值的2倍；值为1.7时，为原始值的1.7倍"
