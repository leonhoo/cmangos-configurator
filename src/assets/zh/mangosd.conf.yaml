    "value": 2000
  - "desc": "生物刷新组（spawn_group）和关联仇恨触发的延迟时间，默认值为2000毫秒（2秒）"
    "key": "CreatureLinkingAggroDelay"
    "value": 2000
  - "desc": "当生物未找到援助对象时，可进入逃跑状态的持续时间，默认值为10000毫秒（10秒）"
    "key": "CreatureFamilyFleeDelay"
    "value": 10000
  - "desc": "世界首领的动态等级与目标（玩家/团队）等级的差值，默认值为3"
    "key": "WorldBossLevelDiff"
    "value": 3
  - "desc": "若目标生物本应拥有战利品（或拾取后可剥皮），但实际未生成任何战利品时，是否仍显示战利品窗口。默认值1（显示），0（不显示）"
