    "value": 300
  - "desc": "在数据库中静态刷新的生物/游戏对象最后使用的GUID之后，为.npc add/.gobject add命令预留的GUID数量。.npc add/.gobject add命令仅能使用该预留范围内的GUID，若预留GUID全部用完，需重启服务器才能再次使用这些命令。该值越小，游戏中动态刷新的对象可使用的GUID数量越多。默认值为100（注：配置文件中实际默认值为10000）"
    "key": "GuidReserveSize.Creature"
    "value": 10000
  - "desc": "在数据库中静态刷新的生物/游戏对象最后使用的GUID之后，为.npc add/.gobject add命令预留的GUID数量。.npc add/.gobject add命令仅能使用该预留范围内的GUID，若预留GUID全部用完，需重启服务器才能再次使用这些命令。该值越小，游戏中动态刷新的对象可使用的GUID数量越多。默认值为100（注：配置文件中实际默认值为10000）"
    "key": "GuidReserveSize.GameObject"
    "value": 10000
