    "value": 600
  "name": "CREATURE AND GAMEOBJECT SETTINGS"
- "items":
  - "desc": "防止玩家使用大量空格（或其他不可见字符）创建虚假聊天消息的保护机制，该机制不适用于插件语言消息，但可能导致依赖普通语言向其他客户端发送数据的旧插件无法正常工作。默认值0（关闭虚假消息防护），1（开启虚假消息防护）"
    "key": "ChatFakeMessagePreventing"
    "value": 0
  - "desc": "检查聊天消息中的游戏内链接（如法术、物品、任务、成就等链接）的严格程度。默认值0（禁用链接检查）；1（仅检查是否使用了有效的管道命令，例如可防止发送图片）；2（验证管道命令的使用顺序是否正确）；3（检查颜色、条目和名称是否一致，若要该等级生效，需确保已提取所有在该服务器游玩的不同语言客户端的本地化DBC文件）"
    "key": "ChatStrictLinkChecking.Severity"
    "value": 0
  - "desc": "定义当检测到消息包含无效管道命令时采取的操作。默认值0（静默忽略该消息），1（踢出发送格式无效消息的玩家）"
    "key": "ChatStrictLinkChecking.Kick"
    "value": 0
  - "desc": "聊天反刷屏保护机制中，触发保护所需的消息数量阈值。默认值10，值为0时禁用反刷屏保护"
    "key": "ChatFlood.MessageCount"
    "value": 10
  - "desc": "聊天反刷屏保护机制中，判定为有效消息的最小发送间隔（以秒为单位），只有间隔大于等于该值的消息才会被计入刷屏检测的数量统计，默认值为1秒"
    "key": "ChatFlood.MessageDelay"
    "value": 1
  - "desc": "聊天反刷屏保护机制触发后，对违规玩家的禁言时长（该时长不保存），默认值为10秒"
    "key": "ChatFlood.MuteTime"
    "value": 10
  - "desc": "控制团队警告（Raid Warnings）聊天频道的使用权限。默认值1（受限模式：仅允许团队领袖和助理在团队中使用）；0（不受限模式：允许队伍中所有成员使用，对应2.0.0 - 3.3.0版本的行为）"
    "key": "Chat.RestrictedRaidWarnings"
    "value": 1
  - "desc": "根据服务器所在区域（RealmZone）限制非拉丁语字符的使用。默认值0（无限制，所有频道可使用任意字符）；1（仅在全局频道中，字符使用受服务器区域语言限制）；2（在全局频道和自定义静态频道中，字符使用受服务器区域语言限制）；3（在全局频道和所有自定义频道中，字符使用受服务器区域语言限制）"
    "key": "Channel.RestrictedLanguageMode"
    "value": 0
  - "desc": "静态自定义频道是预先配置为类似全局频道属性（“世界聊天”模式）的自定义频道，默认无所有者、无管理员、无密码且无预审（除非被GM覆盖设置）。该配置用于设置符合条件的频道达到指定成员数量时，自动转换为静态频道的阈值，默认值0（禁用该自动转换功能）"
    "key": "Channel.StaticAutoTreshold"
    "value": 0
  "name": "CHAT SETTINGS"
- "items":
  - "desc": "GM登录时的模式状态。默认值2（恢复上次保存的状态）；0（禁用GM模式）；1（启用GM模式）"
    "key": "GM.LoginState"
    "value": 2
  - "desc": "GM登录时的可见性状态。默认值2（恢复上次保存的状态）；0（不可见）；1（可见）"
    "key": "GM.Visible"
    "value": 2
  - "desc": "GM默认是否接受玩家提交的工单（申诉单）。默认值2（恢复上次保存的状态）；0（不接受）；1（接受）"
    "key": "GM.AcceptTickets"
    "value": 2
  - "desc": "接收工单通知、提醒以及使用部分相关命令所需的最低GM账号安全等级。默认值2（仅游戏管理员及以上等级）；0（所有人都禁用）；1（仅版主及以上等级）；3（仅管理员）"
    "key": "GM.AcceptTicketsLevel"
    "value": 2
  - "desc": "GM登录时的聊天模式状态。默认值2（恢复上次保存的状态）；0（禁用GM聊天模式）；1（启用GM聊天模式）"
    "key": "GM.Chat"
    "value": 2
  - "desc": "有权使用GM聊天标签所需的最低GM账号安全等级。默认值1（仅版主及以上等级）；0（所有人都禁用）；2（仅游戏管理员及以上等级）；3（仅管理员）"
    "key": "GM.ChatLevel"
    "value": 1
  - "desc": "在频道中执行管理员游戏内命令所需的最低GM账号安全等级，同时该等级可绕过加入需密码频道时的密码验证。默认值1（版主及以上等级可执行）；0（仅拥有游戏内频道管理员权限的账号可执行）；2（游戏管理员及以上等级可执行）；3（仅管理员可执行）"
    "key": "GM.ChannelModerationLevel"
    "value": 1
  - "desc": "能够静默加入和离开频道（无加入/离开公告）所需的最低GM账号安全等级。默认值0（所有人的加入/离开都会发布公告）；1（版主及以上等级静默加入/离开）；2（游戏管理员及以上等级静默加入/离开）；3（仅管理员静默加入/离开）"
    "key": "GM.ChannelSilentJoinLevel"
    "value": 0
  - "desc": "GM默认是否接受玩家的私聊消息。默认值2（恢复上次保存的状态）；0（不接受）；1（接受）"
    "key": "GM.WhisperingTo"
    "value": 2
  - "desc": "当GM处于非GM模式（.gm off）时，能在GM列表中显示的最高GM账号安全等级（若列表可见）。默认值3（所有等级的GM都显示）；0（无GM显示）；1（仅版主显示）；2（仅游戏管理员显示）"
    "key": "GM.InGMList.Level"
    "value": 3
  - "desc": "能在查询列表（who list）中显示的最高GM账号安全等级（若列表可见）。默认值3（所有等级的GM都显示）；0（仅显示普通玩家）；1（仅显示版主）；2（仅显示游戏管理员）"
    "key": "GM.InWhoList.Level"
    "value": 3
  - "desc": "若启用该功能，GM的交易行为以及交易栏位附魔操作会被记录到GM日志中。默认值1（记录），0（不记录）"
    "key": "GM.LogTrade"
    "value": 1
  - "desc": "GM角色的起始等级，取值范围为1到255，默认值为1"
    "key": "GM.StartLevel"
    "value": 1
  - "desc": "是否禁止安全等级较低的GM使用命令与安全等级较高的GM交互。默认值0（禁用该限制），1（启用该限制）"
    "key": "GM.LowerSecurity"
    "value": 0
  - "desc": "当GM使用“.gm visible off”命令隐藏自己时，会施放的光环法术（必须是光环类法术）。默认值31748（大型灵魂粒子效果），值为0时禁用该功能"
    "key": "GM.InvisibleAura"
    "value": 31748
  - "desc": "服务器启动时GM工单队列的状态，若禁用则服务器不接受玩家提交的任何GM工单。默认值1（启用），0（禁用）"
    "key": "GM.TicketsQueueStatus"
    "value": 1
  "name": "GAME MASTER SETTINGS"
- "items":
  - "desc": "设置隐身单位的可见性模式，战争迷雾（Fog Of War）相关设置对GM不生效。默认值0（标准设置：玩家仅能看到自己队伍中的隐身单位）；1（玩家能看到同阵营的隐身单位）"
    "key": "Visibility.FogOfWar.Stealth"
    "value": 0
  - "desc": "设置单位绝对生命值的可见性模式，战争迷雾（Fog Of War）相关设置对GM不生效。默认值0（3.0版本前的标准设置：玩家仅能看到自己队伍中单位的生命值）；1（玩家能看到同阵营单位的生命值）；2（3.0版本后的标准设置：玩家能看到所有单位的生命值）"
    "key": "Visibility.FogOfWar.Health"
    "value": 0
  - "desc": "设置角色属性和攻击属性值的可见性模式，战争迷雾（Fog Of War）相关设置对GM不生效。默认值0（标准设置：玩家仅能看到自己和自己宠物的属性值）；1（玩家能看到同阵营单位的属性值）；2（玩家能看到所有单位的属性值）"
    "key": "Visibility.FogOfWar.Stats"
    "value": 0
  - "desc": "不同地图中游戏对象的可见距离。在大陆地图上默认可见距离为100码，战场/竞技场为533码，副本为170码。最大值受玩家当前所在区域限制：533码；最小值为最大仇恨半径（45码）乘以Rate.Creature.Aggro系数"
    "key": "Visibility.Distance.Continents"
    "value": 100
  - "desc": "不同地图中游戏对象的可见距离。在大陆地图上默认可见距离为100码，战场/竞技场为533码，副本为170码。最大值受玩家当前所在区域限制：533码；最小值为最大仇恨半径（45码）乘以Rate.Creature.Aggro系数"
    "key": "Visibility.Distance.Instances"
    "value": 170
  - "desc": "不同地图中游戏对象的可见距离。在大陆地图上默认可见距离为100码，战场/竞技场为533码，副本为170码。最大值受玩家当前所在区域限制：533码；最小值为最大仇恨半径（45码）乘以Rate.Creature.Aggro系数"
    "key": "Visibility.Distance.BGArenas"
    "value": 533
  - "desc": "当对象当前位置与上次更新可见性时的位置之间的距离达到该值时，会触发对象可见性的更新。默认值为10码"
    "key": "Visibility.RelocationLowerLimit"
    "value": 10
  - "desc": "生物AI对附近移动目标做出反应的延迟时间，默认值为1000毫秒"
    "key": "Visibility.AIRelocationNotifyDelay"
    "value": 1000
  "name": "VISIBILITY AND RADIUSES"
- "items":
  - "desc": "生命值、能量（法力/怒气/集中值等）恢复速率以及受到伤害时的怒气获取速率的倍率，默认值为1"
    "key": "Rate.Health"
    "value": 1
  - "desc": "生命值、能量（法力/怒气/集中值等）恢复速率以及受到伤害时的怒气获取速率的倍率，默认值为1"
    "key": "Rate.Mana"
    "value": 1
  - "desc": "生命值、能量（法力/怒气/集中值等）恢复速率以及受到伤害时的怒气获取速率的倍率，默认值为1"
    "key": "Rate.Rage.Income"
    "value": 1
  - "desc": "生命值、能量（法力/怒气/集中值等）恢复速率以及怒气流失速率的倍率，默认值为1"
    "key": "Rate.Rage.Loss"
    "value": 1
  - "desc": "生命值、能量（法力/怒气/集中值/专注值等）恢复速率以及受到伤害时的怒气获取速率的倍率，默认值为1"
    "key": "Rate.Focus"
    "value": 1
  - "desc": "忠诚度相关的倍率（如宠物忠诚度提升速率），默认值为1"
    "key": "Rate.Loyalty"
    "value": 1
  - "desc": "能量（潜行者的能量）恢复速率的倍率，默认值为1"
    "key": "Rate.Energy"
    "value": 1
  - "desc": "技能发现（如专业技能配方领悟）的概率倍率，默认值为1"
    "key": "Rate.Skill.Discovery"
    "value": 1
  - "desc": "劣质（Poor）品质物品的掉落率倍率，默认值为1"
    "key": "Rate.Drop.Item.Poor"
    "value": 1
  - "desc": "普通（Normal）品质物品的掉落率倍率，默认值为1"
    "key": "Rate.Drop.Item.Normal"
    "value": 1
  - "desc": "优秀（Uncommon）品质物品的掉落率倍率，默认值为1"
    "key": "Rate.Drop.Item.Uncommon"
    "value": 1
  - "desc": "稀有（Rare）品质物品的掉落率倍率，默认值为1"
    "key": "Rate.Drop.Item.Rare"
    "value": 1
  - "desc": "史诗（Epic）品质物品的掉落率倍率，默认值为1"
    "key": "Rate.Drop.Item.Epic"
    "value": 1
  - "desc": "传说（Legendary）品质物品的掉落率倍率，默认值为1"
    "key": "Rate.Drop.Item.Legendary"
    "value": 1
  - "desc": "神器（Artifact）品质物品的掉落率倍率，默认值为1"
    "key": "Rate.Drop.Item.Artifact"
    "value": 1
  - "desc": "引用类物品（Referenced）的掉落率倍率，默认值为1"
    "key": "Rate.Drop.Item.Referenced"
    "value": 1
  - "desc": "任务（Quest）物品的掉落率倍率，默认值为1"
    "key": "Rate.Drop.Item.Quest"
    "value": 1
  - "desc": "金币掉落率的倍率，默认值为1"
    "key": "Rate.Drop.Money"
    "value": 1
  - "desc": "宠物通过击杀目标获取经验值的倍率，默认值为1"
    "key": "Rate.Pet.XP.Kill"
    "value": 1
  - "desc": "玩家通过击杀目标获取经验值的倍率，默认值为1"
    "key": "Rate.XP.Kill"
    "value": 1
  - "desc": "玩家完成任务获取经验值的倍率，默认值为1"
    "key": "Rate.XP.Quest"
    "value": 1
  - "desc": "玩家探索新区域获取经验值的倍率，默认值为1"
    "key": "Rate.XP.Explore"
    "value": 1
  - "desc": "玩家在游戏内休息时，休息点数（双倍经验值点数）的增长倍率（1为正常速率，2为双倍速率，0.5为半速等），默认值为1"
    "key": "Rate.Rest.InGame"
    "value": 1
  - "desc": "玩家离线且处于酒馆或城市中时，休息点数（双倍经验值点数）的增长倍率（1为正常速率，2为双倍速率，0.5为半速等），默认值为1"
    "key": "Rate.Rest.Offline.InTavernOrCity"
    "value": 1
  - "desc": "玩家离线且处于野外时，休息点数（双倍经验值点数）的增长倍率（1为正常速率，2为双倍速率，0.5为半速等），默认值为1"
    "key": "Rate.Rest.Offline.InWilderness"
    "value": 1
  - "desc": "玩家坠落受到伤害的倍率（1为标准伤害，2为双倍伤害，0.5为半伤害等），默认值为1"
    "key": "Rate.Damage.Fall"
    "value": 1
  - "desc": "拍卖行拍卖时长的倍率（如原本24小时的拍卖，倍率为2时变为48小时），默认值为1"
    "key": "Rate.Auction.Time"
    "value": 1
  - "desc": "拍卖行拍卖押金的倍率（拍卖开始时收取的押金金额倍率），默认值为1"
    "key": "Rate.Auction.Deposit"
    "value": 1
  - "desc": "拍卖行手续费的倍率（拍卖结束时从成交价中扣除的手续费比例倍率），默认值为1"
    "key": "Rate.Auction.Cut"
    "value": 1
  - "desc": "拍卖行拍卖押金的最低金额（以铜币为单位），默认值为0"
    "key": "Auction.Deposit.Min"
    "value": 0
  - "desc": "玩家获取荣誉值的倍率，默认值为1"
    "key": "Rate.Honor"
    "value": 1
  - "desc": "采矿次数倍率（Mining.Amount修改矿点可开采的最小/最大次数），默认值为1"
    "key": "Rate.Mining.Amount"
    "value": 1
  - "desc": "采矿续采概率倍率（Mining.Next修改矿点每次开采后可继续开采的概率），默认值为1"
    "key": "Rate.Mining.Next"
    "value": 1
  - "desc": "天赋点数获取倍率（如升级获得的天赋点数倍率），默认值为1"
    "key": "Rate.Talent"
    "value": 1
  - "desc": "玩家获取声望值的倍率，默认值为1"
    "key": "Rate.Reputation.Gain"
    "value": 1
  - "desc": "击杀低等级目标获取声望值的最低倍率，默认值为0.2"
    "key": "Rate.Reputation.LowLevel.Kill"
    "value": 0.2
  - "desc": "完成低等级任务获取声望值的最低倍率，默认值为0.2"
    "key": "Rate.Reputation.LowLevel.Quest"
    "value": 0.2
  - "desc": "团队/英雄副本全局重置间隔天数的乘数，默认值为1（即原始重置间隔）"
    "key": "Rate.InstanceResetTime"
    "value": 1
  - "desc": "制作类专业技能（如锻造、裁缝）的技能提升倍率（每次成功制作获得的技能点数倍率），默认值为1"
    "key": "SkillGain.Crafting"
    "value": 1
  - "desc": "防御类技能（如防御等级）的技能提升倍率，默认值为1"
    "key": "SkillGain.Defense"
    "value": 1
  - "desc": "采集类技能（如采矿、采药、剥皮）的技能提升倍率，默认值为1"
    "key": "SkillGain.Gathering"
    "value": 1
  - "desc": "武器技能（如剑类、锤类武器熟练度）的技能提升倍率，默认值为1"
    "key": "SkillGain.Weapon"
    "value": 1
  - "desc": "橙色难度技能的成功概率（0到100），默认值为100%"
    "key": "SkillChance.Orange"
    "value": 100
  - "desc": "黄色难度技能的成功概率（0到100），默认值为75%"
    "key": "SkillChance.Yellow"
    "value": 75
  - "desc": "绿色难度技能的成功概率（0到100），默认值为25%"
    "key": "SkillChance.Green"
    "value": 25
  - "desc": "灰色难度技能的成功概率（0到100），默认值为0%"
    "key": "SkillChance.Grey"
    "value": 0
  - "desc": "采矿技能成功率随技能等级下降的步长。默认值0表示成功率不随等级下降；值为75时，每提升75点技能等级，成功率减半"
    "key": "SkillChance.MiningSteps"
    "value": 0
  - "desc": "剥皮技能成功率随技能等级下降的步长。默认值0表示成功率不随等级下降；值为75时，每提升75点技能等级，成功率减半"
    "key": "SkillChance.SkinningSteps"
    "value": 0
  - "desc": "钓鱼失败时是否给予垃圾战利品替代。默认值0（禁用），1（启用）"
    "key": "SkillFail.Loot.Fishing"
    "value": 0
  - "desc": "钓鱼失败时是否仍有可能获得技能点数提升。默认值0（禁用），1（启用）"
    "key": "SkillFail.Gain.Fishing"
    "value": 0
  - "desc": "默认情况下，在鱼群中钓鱼时是否因技能等级过低而不会失败。默认值1（启用，即低技能在鱼群钓鱼也不会失败），0（禁用，低技能在鱼群钓鱼可能失败）"
    "key": "SkillFail.Possible.FishingPool"
    "value": 1
  - "desc": "受到或造成伤害时，装备物品损失1点耐久度的概率。默认值0.5（计算方式：100/0.5=200，即每造成/受到200点伤害，从19件可能的装备中随机一件损失1点耐久）"
    "key": "DurabilityLossChance.Damage"
    "value": 0.5
  - "desc": "吸收伤害时，护甲类物品损失1点耐久度的概率。默认值0.5（计算方式：100/0.5=200，即每吸收200点伤害，从15件可能的护甲装备中随机一件损失1点耐久）"
    "key": "DurabilityLossChance.Absorb"
    "value": 0.5
  - "desc": "格挡（招架）攻击时，武器损失1点耐久度的概率。默认值0.05（计算方式：100/0.05=2000，即每招架2000次攻击，主手武器损失1点耐久）"
    "key": "DurabilityLossChance.Parry"
    "value": 0.05
  - "desc": "格挡（阻挡）伤害时，盾牌损失1点耐久度的概率。默认值0.05（计算方式：100/0.05=2000，即每格挡2000次（部分或完全格挡）攻击，盾牌损失1点耐久）"
    "key": "DurabilityLossChance.Block"
    "value": 0.05
  - "desc": "角色在灵魂状态复活时开始获得虚弱状态的等级阈值（基础虚弱时长为1分钟）。默认值11；值为-10时，1级角色复活会获得满时长（10分钟）的虚弱；值为最大玩家等级+1时，任何等级角色复活都不会获得虚弱"
    "key": "Death.SicknessLevel"
    "value": 11
  - "desc": "是否启用因频繁PvP死亡而增加尸体回收延迟的机制。默认值1（启用），0（禁用）"
    "key": "Death.CorpseReclaimDelay.PvP"
    "value": 1
  - "desc": "是否启用因频繁PvE死亡而增加尸体回收延迟的机制。默认值1（启用），0（禁用）"
    "key": "Death.CorpseReclaimDelay.PvE"
    "value": 1
  - "desc": "在常规区域/副本中复活时，是否创建骨头而非尸体。默认值1（启用），0（禁用）"
    "key": "Death.Bones.World"
    "value": 1
  - "desc": "在战场中复活时，是否创建骨头而非尸体。默认值1（启用），0（禁用）"
    "key": "Death.Bones.Battleground"
    "value": 1
  - "desc": "修改玩家灵魂在非战场地图中的移动速度，该效果在复活后移除，非永久/保存属性。默认值1.0（正常速度）"
    "key": "Death.Ghost.RunSpeed.World"
    "value": 1.0
  - "desc": "修改玩家灵魂在战场地图中的移动速度，该效果在复活后移除，非永久/保存属性。默认值1.0（正常速度）"
    "key": "Death.Ghost.RunSpeed.Battleground"
    "value": 1.0
  "name": "SERVER RATES"
- "items":
  - "desc": "对在战场进行过程中离开的玩家施放“逃兵”法术（即添加逃兵debuff）。默认值1（启用），0（禁用）"
    "key": "Battleground.CastDeserter"
    "value": 1
  - "desc": "启用战场排队公告功能，在玩家加入排队时发送聊天公告。默认值0（不发送）；1（仅发送给加入排队的玩家）；2（发送给所有玩家）"
    "key": "Battleground.QueueAnnouncer.Join"
    "value": 0
  - "desc": "启用战场排队公告功能，在战场开始时发送聊天公告。默认值0（禁用），1（启用）"
    "key": "Battleground.QueueAnnouncer.Start"
    "value": 0
  - "desc": "是否启用战场分数统计并存储到数据库中。默认值0（禁用），1（启用）"
    "key": "Battleground.ScoreStatistics"
    "value": 0
  - "desc": "设置战场邀请类型。默认值0（普通模式：尽可能邀请玩家进入战场，不考虑阵营平衡）；1（实验模式：不允许邀请过多同一阵营的玩家）"
    "key": "Battleground.InvitationType"
    "value": 0
  - "desc": "若某一阵营的玩家数量低于每队最低人数，战场将在该时长后提前结束（单位为毫秒）。默认值300000（5分钟）；值为0时禁用该功能（不推荐）"
    "key": "BattleGround.PrematureFinishTimer"
    "value": 300000
  - "desc": "单一阵营的预制队伍在战场排队时，等待另一阵营预制队伍匹配的时长。默认值0（禁用预制队伍匹配，队伍始终以常规方式加入战场）；值为1800000时表示等待30分钟"
    "key": "BattleGround.PremadeGroupWaitForMatch"
    "value": 0
  "name": "BATTLEGROUND CONFIG"
- "items":
  - "desc": "是否启用希利苏斯野外PvP玩法。默认值1（启用），0（禁用）"
    "key": "OutdoorPvp.SIEnabled"
    "value": 1
  - "desc": "是否启用东瘟疫之地野外PvP玩法。默认值1（启用），0（禁用）"
    "key": "OutdoorPvp.EPEnabled"
    "value": 1
  "name": "OUTDOOR PVP CONFIG"
- "items":
  - "desc": "组队时检查排队玩家的天赋。默认值为0（禁用 - 忽略天赋，使用职业优先级，例如战士为坦克、圣骑士为治疗者）；值为1时启用，会根据拥有更多天赋点数的天赋树来设定角色定位。"
    "key": "LFG.Matchmaking"
    "value": 0
  - "desc": "地下城查找器（LFG）队列中的玩家停止使用匹配机制以更快找到队伍的时间（以秒为单位）。该配置仅在匹配机制启用时生效。默认值为600秒（即5分钟）。"
    "key": "LFG.MatchmakingTimer"
    "value": 600
  "name": "MEETING STONE LFG CONFIG"
- "items":
  - "desc": "网络处理使用的线程数，建议每1000个连接使用1个线程。默认值为1。"
    "key": "Network.Threads"
    "value": 1
  - "desc": "所使用的输出内核缓冲区大小（对应SO_SNDBUF套接字选项，可参考TCP手册）。默认值为-1，表示使用系统默认设置。"
    "key": "Network.OutKBuff"
    "value": -1
  - "desc": "输出用的用户态缓冲区，这是为每个连接预留的内存大小。默认值为65536字节。"
    "key": "Network.OutUBuff"
    "value": 65536
  - "desc": "TCP Nagle算法的设置项。默认值为0时启用Nagle算法，网络流量更少但延迟更高；值为1时启用TCP_NO_DELAY，禁用Nagle算法，网络流量更多但延迟更低。"
    "key": "Network.TcpNodelay"
    "value": 1
  - "desc": "当检测到错误的数据包格式时是否踢出玩家。默认值为0，表示不踢出；值为1时表示踢出玩家。"
    "key": "Network.KickOnBadPacket"
    "value": 0
  "name": "NETWORK CONFIG"
- "items":
  - "desc": "是否启用控制台功能。默认值为1，表示开启；值为0时表示关闭。"
    "key": "Console.Enable"
    "value": 1
  - "desc": "是否启用远程控制台功能。默认值为0，表示关闭；值为1时表示开启。"
    "key": "Ra.Enable"
    "value": 0
  - "desc": "远程控制台的默认IP地址，设置为0.0.0.0表示允许从任意地址访问远程控制台。"
    "key": "Ra.IP"
    "value": "0.0.0.0"
  - "desc": "远程控制台的默认端口号。默认值为3443。"
    "key": "Ra.Port"
    "value": 3443
  - "desc": "登录远程控制台所需的最低权限等级，默认值为3（管理员权限等级）。"
    "key": "Ra.MinLevel"
    "value": 3
  - "desc": "当输入错误密码时是否踢出客户端。默认值为1，表示开启该功能；值为0时表示关闭。"
    "key": "Ra.Secure"
    "value": 1
  - "desc": "是否禁止通过远程控制台（RA）执行仅控制台级别的命令。默认值为1，表示开启限制（不允许执行）；值为0时表示关闭限制（允许执行）。"
    "key": "Ra.Restricted"
    "value": 1
  - "desc": "是否启用SOAP服务。默认值为0，表示关闭；值为1时表示开启。"
    "key": "SOAP.Enabled"
    "value": 0
  - "desc": "SOAP服务绑定的IP地址，设置为0.0.0.0可允许从任意地址访问SOAP服务。默认值为127.0.0.1（仅本地可访问）。"
    "key": "SOAP.IP"
    "value": "127.0.0.1"
  - "desc": "SOAP服务使用的端口号。默认值为7878。"
    "key": "SOAP.Port"
    "value": 7878
  "name": "CONSOLE, REMOTE ACCESS AND SOAP"
- "items":
  - "desc": "角色删除的行为模式。默认值为0，表示将角色从数据库中彻底移除；值为1时为解除关联模式，角色会与账号解除关联，角色名被释放，且在游戏内显示为已删除状态。"
    "key": "CharDelete.Method"
    "value": 0
  - "desc": "当角色未达到指定等级时，将按照CharDelete.Method=0的方式删除角色。默认值为0，表示所有角色都将使用指定的删除模式；值大于等于1时，仅达到该等级的角色会按指定模式删除，其余角色均按CharDelete.Method=0的方式删除。"
    "key": "CharDelete.MinLevel"
    "value": 0
  - "desc": "定义角色在数据库中保留的天数，超过该天数后角色将被移除。默认值为30天；值为0时表示不删除任何角色，角色将永久保留在数据库中。"
    "key": "CharDelete.KeepDays"
    "value": 30
  "name": "CharDelete Configuration"
- "items":
  - "desc": "启用或禁用指标日志记录功能（该功能要求核心编译时开启BUILD_METRICS选项）。默认值为0，表示禁用；值为1时表示启用。"
    "key": "Metric.Enable"
    "value": 0
  - "desc": "存储指标数据的InfluxDB数据库的IP地址/主机名。默认值为'127.0.0.1'（本地地址）。"
    "key": "Metric.Address"
    "value": "127.0.0.1"
  - "desc": "存储指标数据的InfluxDB数据库使用的端口号。默认值为8086。"
    "key": "Metric.Port"
    "value": 8086
  - "desc": "存储指标数据的InfluxDB数据库名称。默认值为'perfd'。"
    "key": "Metric.Database"
    "value": "perfd"
  - "desc": "访问存储指标数据的InfluxDB数据库所需的用户名。默认值为空字符串，表示无需用户名。"
    "key": "Metric.Username"
    "value": ""
  - "desc": "访问存储指标数据的InfluxDB数据库所需的密码。默认值为空字符串，表示无需密码。"
    "key": "Metric.Password"
    "value": ""
  "name": "METRICS CONFIGURATION -> Require core builded with BUILD_METRICS option"
