- "items":
  - "desc": "RealmID must match the realmlist inside the realmd database"
    "key": "RealmID"
    "value": 1
  - "desc": "Data directory setting. Important: DataDir needs to be quoted, as it is a string which may contain space characters. Example: 'D:/Temp/cmangos/output/share/mangos'"
    "key": "DataDir"
    "value": "."
  - "desc": "Logs directory setting. Important: Logs dir must exists, or all logs need to be disabled. Default: '' - no log directory prefix. if used log names aren't absolute paths then logs will be stored in the current directory of the running program."
    "key": "LogsDir"
    "value": ""
  - "desc": "Database connection settings for the world server. Default: ---MYSQL--- hostname;port;username;password;database .;somenumber;username;password;database - use named pipes at Windows Named pipes: mySQL required adding 'enable-named-pipe' to [mysqld] section my.ini .;/path/to/unix_socket;username;password;database - use Unix sockets at Unix/Linux ---PGSQL--- hostname;port;username;password;database .;/path/to/unix_socket/DIRECTORY or . for default path;username;password;database - use Unix sockets at Unix/Linux"
    "key": "LoginDatabaseInfo"
    "value": "127.0.0.1;3306;mangos;mangos;classicrealmd"
  - "desc": "Database connection settings for the world server. Default: ---MYSQL--- hostname;port;username;password;database .;somenumber;username;password;database - use named pipes at Windows Named pipes: mySQL required adding 'enable-named-pipe' to [mysqld] section my.ini .;/path/to/unix_socket;username;password;database - use Unix sockets at Unix/Linux ---PGSQL--- hostname;port;username;password;database .;/path/to/unix_socket/DIRECTORY or . for default path;username;password;database - use Unix sockets at Unix/Linux"
    "key": "WorldDatabaseInfo"
    "value": "127.0.0.1;3306;mangos;mangos;classicmangos"
  - "desc": "Database connection settings for the world server. Default: ---MYSQL--- hostname;port;username;password;database .;somenumber;username;password;database - use named pipes at Windows Named pipes: mySQL required adding 'enable-named-pipe' to [mysqld] section my.ini .;/path/to/unix_socket;username;password;database - use Unix sockets at Unix/Linux ---PGSQL--- hostname;port;username;password;database .;/path/to/unix_socket/DIRECTORY or . for default path;username;password;database - use Unix sockets at Unix/Linux"
    "key": "CharacterDatabaseInfo"
    "value": "127.0.0.1;3306;mangos;mangos;classiccharacters"
  - "desc": "Database connection settings for the world server. Default: ---MYSQL--- hostname;port;username;password;database .;somenumber;username;password;database - use named pipes at Windows Named pipes: mySQL required adding 'enable-named-pipe' to [mysqld] section my.ini .;/path/to/unix_socket;username;password;database - use Unix sockets at Unix/Linux ---PGSQL--- hostname;port;username;password;database .;/path/to/unix_socket/DIRECTORY or . for default path;username;password;database - use Unix sockets at Unix/Linux"
    "key": "LogsDatabaseInfo"
    "value": "127.0.0.1;3306;mangos;mangos;classiclogs"
  - "desc": "Amount of connections to database which will be used for SELECT queries. Maximum 16 connections per database. Please, note, for data consistency only one connection for each database is used for transactions and async SELECTs. So formula to find out how many connections will be established: X = #_connections + 1. Default: 1 connection for SELECT statements"
    "key": "LoginDatabaseConnections"
    "value": 1
  - "desc": "Amount of connections to database which will be used for SELECT queries. Maximum 16 connections per database. Please, note, for data consistency only one connection for each database is used for transactions and async SELECTs. So formula to find out how many connections will be established: X = #_connections + 1. Default: 1 connection for SELECT statements"
    "key": "WorldDatabaseConnections"
    "value": 1
  - "desc": "Amount of connections to database which will be used for SELECT queries. Maximum 16 connections per database. Please, note, for data consistency only one connection for each database is used for transactions and async SELECTs. So formula to find out how many connections will be established: X = #_connections + 1. Default: 1 connection for SELECT statements"
    "key": "CharacterDatabaseConnections"
    "value": 1
  - "desc": "Amount of connections to database which will be used for SELECT queries. Maximum 16 connections per database. Please, note, for data consistency only one connection for each database is used for transactions and async SELECTs. So formula to find out how many connections will be established: X = #_connections + 1. Default: 1 connection for SELECT statements"
    "key": "LogsDatabaseConnections"
    "value": 1
  - "desc": "Settings for maximum database-ping interval (minutes between pings)"
    "key": "MaxPingTime"
    "value": 30
  - "desc": "Port on which the server will listen"
    "key": "WorldServerPort"
    "value": 8085
  - "desc": "Bind World Server to specific IP address. This option is useful for running multiple worldd/realmd instances on different IP addresses using default ports. DO NOT CHANGE THIS UNLESS YOU _REALLY_ KNOW WHAT YOU'RE DOING"
    "key": "BindIP"
    "value": "0.0.0.0"
  - "desc": "Log File for SD2-Errors"
    "key": "SD2ErrorLogFile"
    "value": "SD2Errors.log"
  - "desc": "Regenerates table creature_zone and gameobject_zone. Default: 0 - turned off"
    "key": "Spawns.ZoneArea"
    "value": 0
  "name": "CONNECTIONS AND DIRECTORIES"
- "items":
  - "desc": "Used processors mask for multi-processors system (Used only at Windows). Default: 0 (selected by OS) number (bitmask value of selected processors)"
    "key": "UseProcessors"
    "value": 0
  - "desc": "Process priority setting (Used only at Windows). Default: 1 (HIGH) 0 (Normal)"
    "key": "ProcessPriority"
    "value": 1
  - "desc": "Compression level for update packages sent to client (1..9). Default: 1 (speed) 9 (best compression)"
    "key": "Compression"
    "value": 1
  - "desc": "Maximum number of players in the world. Excluding Mods, GM's and Admins. Default: 100 0 (for infinite players) -1 (for Mods, GM's and Admins only) -2 (for GM's and Admins only) -3 (for Admins only)"
    "key": "PlayerLimit"
    "value": 100
  - "desc": "Save respawn time for creatures at death and for gameobjects at use/open. Default: 1 (save creature/gameobject respawn time without waiting grid unload) 0 (save creature/gameobject respawn time at grid unload)"
    "key": "SaveRespawnTimeImmediately"
    "value": 1
  - "desc": "Maximum overspeed ping count before player kick (minimum is 2, 0 used to disable check). Default: 2"
    "key": "MaxOverspeedPings"
    "value": 2
  - "desc": "Unload grids (if you have lot memory you can disable it to speed up player move to new grids second time). Default: 1 (unload grids) 0 (do not unload grids)"
    "key": "GridUnload"
    "value": 1
  - "desc": "Load grids of maps at server startup (if you have lot memory you can try it to have a living world always loaded). This also allow ALL creatures on the given maps to update their grid without any player around. Default: '' (don't load all grids at startup) 'mapId1[,mapId2[..]]' (DO load all grids on the given maps- Experimental and very resource consumming)"
    "key": "LoadAllGridsOnMaps"
    "value": ""
  - "desc": "Load active creatures that have ExtraFlags CREATURE_EXTRA_FLAG_ACTIVE or movementType WAYPOINT_MOTION_TYPE. This will allow creatures having these conditions to update their grid without any player around. Useful for running in debug mode. Default: True"
    "key": "Autoload.Active"
    "value": 1
  - "desc": "Grid clean up delay (in milliseconds). Default: 300000 (5 min)"
    "key": "GridCleanUpDelay"
    "value": 300000
  - "desc": "Map update interval (in milliseconds). Default: 100"
    "key": "MapUpdateInterval"
    "value": 100
  - "desc": "Weather update interval (in milliseconds). Default: 600000 (10 min)"
    "key": "ChangeWeatherInterval"
    "value": 600000
  - "desc": "Player save interval (in milliseconds). Default: 900000 (15 min)"
    "key": "PlayerSave.Interval"
    "value": 900000
  - "desc": "Minimum level for saving character stats for external usage in database. Default: 0 (do not save character stats) 1+ (save stats for characters with level 1+)"
    "key": "PlayerSave.Stats.MinLevel"
    "value": 0
  - "desc": "Enable/Disable saving of character stats only on logout. Default: 1 (only save on logout) 0 (save on every player save)"
    "key": "PlayerSave.Stats.SaveOnlyOnLogout"
    "value": 1
  - "desc": "Enable/Disable VMaps support for line of sight and height calculation. You need to extract the VMaps in order to enable those options. Default: 1 (enable) 0 (disable)"
    "key": "vmap.enableLOS"
    "value": 1
  - "desc": "Enable/Disable VMaps support for line of sight and height calculation. You need to extract the VMaps in order to enable those options. Default: 1 (enable) 0 (disable)"
    "key": "vmap.enableHeight"
    "value": 1
  - "desc": "Enable/Disable VMap based indoor check to remove outdoor-only auras (mounts etc.). Requires VMaps enabled to work. Default: 1 (Enabled) 0 (Disabled)"
    "key": "vmap.enableIndoorCheck"
    "value": 1
  - "desc": "Check final move position, summon position, etc for visible collision with other objects or wall (wall only if vmaps are enabled). Default: 1 (enable, requires more CPU power) 0 (disable, not so nice position selection but will require less CPU power)"
    "key": "DetectPosCollision"
    "value": 1
  - "desc": "Enable/Disable pathfinding using mmaps. Default: 1 (enable) 0 (disable)"
    "key": "mmap.enabled"
    "value": 1
  - "desc": "Disable mmap pathfinding on the listed maps. List of map ids with delimiter ','"
    "key": "mmap.ignoreMapIds"
    "value": ""
  - "desc": "Enable/Disable preloading on first mapId load - expensive but thread safe - use only for big servers. 1 (enable) Default: 0 (disable)"
    "key": "mmap.preload"
    "value": 0
  - "desc": "Use or not path finder path optimization (cut calculated points). 0 (disable) Default: 1 (enable)"
    "key": "PathFinder.OptimizePath"
    "value": 1
  - "desc": "Correct calculated path points Z (height). Increase CPU usage, but fix Z accuracy. Default: 0 (disable) 1 (enable)"
    "key": "PathFinder.NormalizeZ"
    "value": 0
  - "desc": "Update realm uptime period in minutes (for save data in 'uptime' table). Must be > 0. Default: 10 (minutes)"
    "key": "UpdateUptimeInterval"
    "value": 10
  - "desc": "Number of threads to use for maps update. Default: 3. Don't put more thread then your number of CPU threads -1 for this to work stable."
    "key": "MapUpdate.Threads"
    "value": 3
  - "desc": "Periodically check if the process got freezed, if this is the case force crash after the specified amount of seconds. Must be > 0. Recommended > 10 secs if you use this. Default: 0 (Disabled)"
    "key": "MaxCoreStuckTime"
    "value": 0
  - "desc": "Permit/disable the use of the addon channel through the server (some client side addons can stop work correctly with disabled addon channel). Default: 1 (permit addon channel) 0 (do not permit addon channel)"
    "key": "AddonChannel"
    "value": 1
  - "desc": "Perform character db cleanups on start up. Default: 1 (Enable) 0 (Disabled)"
    "key": "CleanCharacterDB"
    "value": 1
  - "desc": "Set the max number of players returned in the /who list and interface (0 means unlimited). Default: 49 - (stable)"
    "key": "MaxWhoListReturns"
    "value": 49
  "name": "PERFORMANCE SETTINGS"
- "items":
  - "desc": "Enable logging of GM commands - all SQL code will be written to a log file. All commands are written to a file: YYYY-MM-DD_logSQL.sql. If a new day starts (00:00:00), a new file is created - the old file will not be deleted. Default: 1 - Write SQL code to logfile 0 - Do not log"
    "key": "LogSQL"
    "value": 1
  - "desc": "World daemon PID file. Default: '' - do not create PID file './worldd.pid' - create PID file (recommended name)"
    "key": "PidFile"
    "value": ""
  - "desc": "Server console level of logging. 0 = Minimum; 1 = Basic&Error; 2 = Detail; 3 = Full/Debug. Default: 3"
    "key": "LogLevel"
    "value": 1
  - "desc": "Include time in server console output [hh:mm:ss]. Default: 0 (no time) 1 (print time)"
    "key": "LogTime"
    "value": 0
  - "desc": "Logfile name. Default: 'Server.log' '' - Empty name disable creating log file"
    "key": "LogFile"
    "value": "Server.log"
  - "desc": "Description: Binary packet logging file for the world server. Filename extension must be .pkt to be parsable with WPP. Example: 'World.pkt' - (Enabled) Default: '' - (Disabled)"
    "key": "PacketLogFile"
    "value": ""
  - "desc": "Logfile with timestamp of server start in name. Default: 0 - no timestamp in name 1 - add timestamp in name in form Logname_YYYY-MM-DD_HH-MM-SS.Ext for Logname.Ext"
    "key": "LogTimestamp"
    "value": 0
  - "desc": "Server file level of logging. 0 = Minimum; 1 = Error; 2 = Detail; 3 = Full/Debug. Default: 0"
    "key": "LogFileLevel"
    "value": 0
  - "desc": "Log filters (active by default - meaning: the filter is active, hence the log is not displayed). Default: 1 - not include with any log level 0 - include in log if log level permit"
    "key": "LogFilter_TransportMoves"
    "value": 1
  - "desc": "Log filters (active by default - meaning: the filter is active, hence the log is not displayed). Default: 1 - not include with any log level 0 - include in log if log level permit"
    "key": "LogFilter_CreatureMoves"
    "value": 1
  - "desc": "Log filters (active by default - meaning: the filter is active, hence the log is not displayed). Default: 1 - not include with any log level 0 - include in log if log level permit"
    "key": "LogFilter_VisibilityChanges"
    "value": 1
  - "desc": "Log filters (active by default - meaning: the filter is active, hence the log is not displayed). Default: 1 - not include with any log level 0 - include in log if log level permit"
    "key": "LogFilter_Weather"
    "value": 1
  - "desc": "Log filters (active by default - meaning: the filter is active, hence the log is not displayed). Default: 1 - not include with any log level 0 - include in log if log level permit"
    "key": "LogFilter_DbStrictedCheck"
    "value": 1
  - "desc": "Log filters (active by default - meaning: the filter is active, hence the log is not displayed). Default: 1 - not include with any log level 0 - include in log if log level permit"
    "key": "LogFilter_Pathfinding"
    "value": 1
  - "desc": "Log filters (active by default - meaning: the filter is active, hence the log is not displayed). Default: 1 - not include with any log level 0 - include in log if log level permit"
    "key": "LogFilter_MapsLoading"
    "value": 1
  - "desc": "Log filters (active by default - meaning: the filter is active, hence the log is not displayed). Default: 1 - not include with any log level 0 - include in log if log level permit"
    "key": "LogFilter_EventAiDev"
    "value": 1
  - "desc": "Log filters (active by default - meaning: the filter is active, hence the log is not displayed). Default: 1 - not include with any log level 0 - include in log if log level permit"
    "key": "LogFilter_DbScriptDev"
    "value": 1
  - "desc": "Log filters (disabled by default, mostly debug only output affected cases). Default: 0 - include in log if log level permit 1 - not include with any log level"
    "key": "LogFilter_PeriodicAffects"
    "value": 0
  - "desc": "Log filters (active by default - meaning: the filter is active, hence the log is not displayed). Default: 1 - not include with any log level 0 - include in log if log level permit"
    "key": "LogFilter_PlayerMoves"
    "value": 1
  - "desc": "Log filters (active by default - meaning: the filter is active, hence the log is not displayed). Default: 1 - not include with any log level 0 - include in log if log level permit"
    "key": "LogFilter_SQLText"
    "value": 1
  - "desc": "Log filters (disabled by default, mostly debug only output affected cases). Default: 0 - include in log if log level permit 1 - not include with any log level"
    "key": "LogFilter_AIAndMovegens"
    "value": 0
  - "desc": "Log filters (disabled by default, mostly debug only output affected cases). Default: 0 - include in log if log level permit 1 - not include with any log level"
    "key": "LogFilter_PlayerStats"
    "value": 0
  - "desc": "Log filters (disabled by default, mostly debug only output affected cases). Default: 0 - include in log if log level permit 1 - not include with any log level"
    "key": "LogFilter_Damage"
    "value": 0
  - "desc": "Log filters (disabled by default, mostly debug only output affected cases). Default: 0 - include in log if log level permit 1 - not include with any log level"
    "key": "LogFilter_Combat"
    "value": 0
  - "desc": "Log filters (disabled by default, mostly debug only output affected cases). Default: 0 - include in log if log level permit 1 - not include with any log level"
    "key": "LogFilter_SpellCast"
    "value": 0
  - "desc": "Packet logging file for the worldserver. Default: '' - no log file created 'world.log' - recommended name to create a log file"
    "key": "WorldLogFile"
    "value": ""
  - "desc": "Logfile with timestamp of server start in name. Default: 0 - no timestamp in name 1 - add timestamp in name in form Logname_YYYY-MM-DD_HH-MM-SS.Ext for Logname.Ext"
    "key": "WorldLogTimestamp"
    "value": 0
  - "desc": "Log file of DB errors detected at server run. Default: 'DBErrors.log'"
    "key": "DBErrorLogFile"
    "value": "DBErrors.log"
  - "desc": "Log file of EventAI errors detected at server run. Default: 'EventAIErrors.log'"
    "key": "EventAIErrorLogFile"
    "value": "EventAIErrors.log"
  - "desc": "Character operations logfile name. Default: 'Char.log' '' - Empty name disable creating log file"
    "key": "CharLogFile"
    "value": "Char.log"
  - "desc": "Logfile with timestamp of server start in name. Default: 0 - no timestamp in name 1 - add timestamp in name in form Logname_YYYY-MM-DD_HH-MM-SS.Ext for Logname.Ext"
    "key": "CharLogTimestamp"
    "value": 0
  - "desc": "Write character dump before deleting in Char.log. For restoration, cut character data from log starting from line == START DUMP == to line == END DUMP == (without its) in file and load it using loadpdump command. Default: 0 - don't include dumping chars to log 1 - include dumping chars to log"
    "key": "CharLogDump"
    "value": 0
  - "desc": "GM Log file of gm commands. Default: '' (Disable)"
    "key": "GmLogFile"
    "value": ""
  - "desc": "GM Logfile with timestamp of server start in name. Default: 0 - no timestamp in name 1 - add timestamp in name in form Logname_YYYY-MM-DD_HH-MM-SS.Ext for Logname.Ext"
    "key": "GmLogTimestamp"
    "value": 0
  - "desc": "GM Logfiles with GM account id (Note: logs not created if GmLogFile not set). Default: 0 - add gm log data to single log file 1 - add gm log data to account specific log files with name in form Logname_#ID_YYYY-MM-DD_HH-MM-SS.Ext or form Logname_#ID.Ext"
    "key": "GmLogPerAccount"
    "value": 0
  - "desc": "Log file of RA commands. Default: 'Ra.log' '' - Empty name for disable"
    "key": "RaLogFile"
    "value": ""
  - "desc": "Color for messages (format 'normal_color details_color debug_color error_color'). Colors: 0 - BLACK, 1 - RED, 2 - GREEN,  3 - BROWN, 4 - BLUE, 5 - MAGENTA, 6 -  CYAN, 7 - GREY, 8 - YELLOW, 9 - LRED, 10 - LGREEN, 11 - LBLUE, 12 - LMAGENTA, 13 - LCYAN, 14 - WHITE. Default: '' - none colors. Example: '13 7 11 9'"
    "key": "LogColors"
    "value": ""
  "name": "SERVER LOGGING"
- "items":
  - "desc": "Server realm style. 0 = NORMAL; 1 = PVP; 4 = NORMAL; 6 = RP; 8 = RPPVP. also custom type: 16 FFA_PVP (free for all pvp mode like arena PvP in all zones except rest activated places and sanctuaries)"
    "key": "GameType"
    "value": 1
  - "desc": "Server realm zone (set allowed alphabet in character names/etc). See also Strict*Names options. 1 Development - any language (Default) 2 United States - extended-Latin 3 Oceanic - extended-Latin 4 Latin America - extended-Latin 5 Tournament - basic-Latin at create, any at login 6 Korea - East-Asian 7 Tournament - basic-Latin at create, any at login 8 English - extended-Latin 9 German - extended-Latin 10 French - extended-Latin 11 Spanish - extended-Latin 12 Russian - Cyrillic 13 Tournament - basic-Latin at create, any at login 14 Taiwan - East-Asian 15 Tournament - basic-Latin at create, any at login 16 China - East-Asian 17 CN1 - basic-Latin at create, any at login 18 CN2 - basic-Latin at create, any at login 19 CN3 - basic-Latin at create, any at login 20 CN4 - basic-Latin at create, any at login 21 CN5 - basic-Latin at create, any at login 22 CN6 - basic-Latin at create, any at login 23 CN7 - basic-Latin at create, any at login 24 CN8 - basic-Latin at create, any at login 25 Tournament - basic-Latin at create, any at login 26 Test Server - any language 27 Tournament - basic-Latin at create, any at login 28 QA Server - any language 29 CN9 - basic-Latin at create, any at login"
    "key": "RealmZone"
    "value": 1
  - "desc": "DBC Language Settings. 0 = English; 1 = Korean; 2 = French; 3 = German; 4 = Chinese; 5 = Taiwanese; 6 = Spanish; 255 = Auto Detect (Default)"
    "key": "DBC.Locale"
    "value": 255
  - "desc": ""
    "key": "DeclinedNames"
    "value": 0
  - "desc": "Limit player name to language specific symbols set, not allow create characters, and set rename request and disconnect at not allowed symbols name. Default: 0 disable (but limited server timezone dependent client check) 1 basic latin characters (strict) 2 realm zone specific (strict). See RealmZone setting. Note: In any case if you want correctly see character name at client this client must have apporopriate fonts (included in client by default, with active official localization or custom localization fonts in clientdir/Fonts). 3 basic latin characters + server timezone specific"
    "key": "StrictPlayerNames"
    "value": 0
  - "desc": "Limit guild team charter names to language specific symbols set, not allow create charters with not allowed symbols in name. Default: 0 disable 1 basic latin characters (strict) 2 realm zone specific (strict). See RealmZone setting. Note: In any case if you want correctly see character name at client this client must have apporopriate fonts (included in client by default, with active official localization or custom localization fonts in clientdir/Fonts). 3 basic latin characters + server timezone specific"
    "key": "StrictCharterNames"
    "value": 0
  - "desc": "Limit pet names to language specific symbols set. Default: 0 disable 1 basic latin characters (strict) 2 realm zone specific (strict). See RealmZone setting. Note: In any case if you want correctly see character name at client this client must have apporopriate fonts (included in client by default, with active official localization or custom localization fonts in clientdir/Fonts). 3 basic latin characters + server timezone specific"
    "key": "StrictPetNames"
    "value": 0
  - "desc": "Minimal name length (1..12). Default: 2"
    "key": "MinPlayerName"
    "value": 2
  - "desc": "Minimal name length (1..24). Default: 2"
    "key": "MinCharterName"
    "value": 2
  - "desc": "Minimal name length (1..12). Default: 2"
    "key": "MinPetName"
    "value": 2
  - "desc": "Disable characters creating for specific team or any (non-player accounts not affected). Default: 0 - enabled 1 - disabled only for Alliance 2 - disabled only for Horde 3 - disabled for both teams"
    "key": "CharactersCreatingDisabled"
    "value": 0
  - "desc": "Limit numbers of characters per account (at all realms). Note: this setting limits the character creating at the _current_ realm base at characters amount at all realms. Default: 50. The number must be >= CharactersPerRealm"
    "key": "CharactersPerAccount"
    "value": 50
  - "desc": "Limit numbers of characters for account at realm. Default: 10 (client limitation). The number must be between 1 and 10"
    "key": "CharactersPerRealm"
    "value": 10
  - "desc": "Disable in-game script movie at first character's login(allows to prevent buggy intro in case of custom start location coordinates). Default: 0 - show intro for each new character 1 - show intro only for first character of selected race 2 - disable intro in all cases"
    "key": "SkipCinematics"
    "value": 0
  - "desc": "Max level that can be reached by a player for experience (in range from 1 to 100). Change not recommended. Default: 60"
    "key": "MaxPlayerLevel"
    "value": 60
  - "desc": "Staring level that have character at creating (in range 1 to MaxPlayerLevel). Default: 1"
    "key": "StartPlayerLevel"
    "value": 1
  - "desc": "Amount of money that new players will start with. If you want to start with one silver, use for example 100 (100 copper = 1 silver). Default: 0"
    "key": "StartPlayerMoney"
    "value": 0
  - "desc": "Max honor points that player can have. Default: 75000"
    "key": "MaxHonorPoints"
    "value": 75000
  - "desc": "Amount of honor that new players will start with. Default: 0"
    "key": "StartHonorPoints"
    "value": 0
  - "desc": "Min kills that players must obtain to enter in weekly honor calculation. Default: 15"
    "key": "MinHonorKills"
    "value": 15
  - "desc": "The day of the week is performed server maintenance ( currently used for Honor distribution ). range (0..6): 0 is the first day of the week (normally sunday), 6 is the latest. Default: 3 (Wednesday in EU)"
    "key": "MaintenanceDay"
    "value": 3
  - "desc": "Enable or disable instant logout for security level (0..4) or high (NOT in combat/while dueling/while falling). Default: 1 (Mods/GMs/Admins)"
    "key": "InstantLogout"
    "value": 1
  - "desc": "Enable or disable Waterbreathing. Default: 4 (Console as noneone)"
    "key": "DisableWaterBreath"
    "value": 4
  - "desc": "Controls whether quest greetings (used when NPC is a quest giver but does not have UNIT_NPC_FLAG_GOSSIP) is always shown, or is shown only if there are more than one menu items available to the player. Default: 0 (disabled, original behavior) 1 (enabled)"
    "key": "AlwaysShowQuestGreeting"
    "value": 0
  - "desc": "Workaround for client bug: resuming taxi flight on login causes missing chat channels until the flight ends. When enabled allows clients to join local channels of the zone they are flying over on login and all custom channels. Default: 0 (disabled, original client behavior) 1 (enabled)"
    "key": "TaxiFlightChatFix"
    "value": 0
  - "desc": "Controls whether logging out in multi-destination taxi flight will resume entire flight or the nearest destination only. Default: 0 (false) 1 (true)"
    "key": "LongFlightPathsPersistence"
    "value": 0
  - "desc": "Players will start with all flight paths (Note: ALL flight paths, not only player's team). Default: 0 (true) 1 (false)"
    "key": "AllFlightPaths"
    "value": 0
  - "desc": "Players will automatically gain max level dependent (weapon/defense) skill when logging in, leveling up etc. Default: 0 (false) 1 (true)"
    "key": "AlwaysMaxSkillForLevel"
    "value": 0
  - "desc": "Activate weather system. Default: 1 (true) 0 (false)"
