  - desc: "Enable anti spam system"
    key: "AnticheatConf.Antispam.Enable"
    value: 1
  - desc: "Automatically silence accounts identified as spammers"
    key: "AnticheatConf.Antispam.Silence"
    value: 0
  - desc: "Above this level, the spam filter will not be enforced"
    key: "AnticheatConf.Antispam.MaxLevel"
    value: 25
  - desc: "Mask of normalization flags to use when normalizing messages prior to spam checks"
    key: "AnticheatConf.Antispam.NormalizeMask"
    value: 0
  - desc: "Time, in seconds, between each analysis of recent messages for spam"
    key: "AnticheatConf.Antispam.AnalysisTimer"
    value: 30
  - desc: "Maximum messages per minute to be considered spamming based solely on the outgoing rate.  Zero to disable."
    key: "AnticheatConf.Antispam.MaxRate"
    value: 30
  - desc: "Grace period, in seconds, before messaging rate is checked against maximum allowed value for spam"
    key: "AnticheatConf.Antispam.RateGracePeriod"
    value: 45
  - desc: "Maximum percentage of whisper and mail recipients which can be unique before being considered spam.  Zero to disable."
    key: "AnticheatConf.Antispam.MaxUniquePercentage"
    value: 90
  - desc: "Minimum whispers or mails before unique recipient percentage is considered. WARNING: Zero does NOT disable this!  To disable, set Antispam.MaxUniquePercentage to zero"
    key: "AnticheatConf.Antispam.MinUniqueMessages"
    value: 100
  - desc: "How many occurrences of blacklist entries before a GM notification is sent out.  Zero to disable."
    key: "AnticheatConf.Antispam.BlacklistNotify"
    value: 5
