    desc_cn: "采矿技能成功率随技能等级下降的步长。默认值0表示成功率不随等级下降；值为75时，每提升75点技能等级，成功率减半"
  - key: "SkillChance.SkinningSteps"
    default_value: 0
    desc_en: "For skinning and Mining chance decrease with skill level. Default: 0 - no decrease, 75 - in 2 times each 75 skill points"
    desc_cn: "剥皮技能成功率随技能等级下降的步长。默认值0表示成功率不随等级下降；值为75时，每提升75点技能等级，成功率减半"
  - key: "SkillFail.Loot.Fishing"
    default_value: 0
    desc_en: "For fishing instead fail provided junk loot. Default: 0 (disabled), 1 (enabled)"
    desc_cn: "钓鱼失败时是否给予垃圾战利品替代。默认值0（禁用），1（启用）"
  - key: "SkillFail.Gain.Fishing"
    default_value: 0
    desc_en: "For fishing skill gain possible at fail also. Default: 0 (disabled), 1 (enabled)"
    desc_cn: "钓鱼失败时是否仍有可能获得技能点数提升。默认值0（禁用），1（启用）"
  - key: "SkillFail.Possible.FishingPool"
    default_value: 1
    desc_en: "For fishing pool impossible fail from low skill by default. Default: 1 (enabled), 0 (disabled)"
    desc_cn: "默认情况下，在鱼群中钓鱼时是否因技能等级过低而不会失败。默认值1（启用，即低技能在鱼群钓鱼也不会失败），0（禁用，低技能在鱼群钓鱼可能失败）"
  - key: "DurabilityLossChance.Damage"
    default_value: 0.5
    desc_en: "Chance lost one from equiped items durability point at damage apply or receive. Default: 0.5 (100/0.5 = 200) Each 200 damage apply one from 19 possible equipped items"
    desc_cn: "受到或造成伤害时，装备物品损失1点耐久度的概率。默认值0.5（计算方式：100/0.5=200，即每造成/受到200点伤害，从19件可能的装备中随机一件损失1点耐久）"
  - key: "DurabilityLossChance.Absorb"
    default_value: 0.5
    desc_en: "Chance lost one from armor items durability point at damage absorb. Default: 0.5 (100/0.5 = 200) Each 200 absorbs apply one from 15 possible armor equipped items"
    desc_cn: "吸收伤害时，护甲类物品损失1点耐久度的概率。默认值0.5（计算方式：100/0.5=200，即每吸收200点伤害，从15件可能的护甲装备中随机一件损失1点耐久）"
  - key: "DurabilityLossChance.Parry"
    default_value: 0.05
    desc_en: "Chance lost weapon durability point at parry. Default: 0.05 (100/0.05 = 2000) Each 2000 parry attacks main weapon lost point"
    desc_cn: "格挡（招架）攻击时，武器损失1点耐久度的概率。默认值0.05（计算方式：100/0.05=2000，即每招架2000次攻击，主手武器损失1点耐久）"
  - key: "DurabilityLossChance.Block"
    default_value: 0.05
    desc_en: "Chance lost sheild durability point at damage block. Default: 0.05 (100/0.05 = 2000) Each 2000 partly or full blocked attacks shield lost point"
    desc_cn: "格挡（阻挡）伤害时，盾牌损失1点耐久度的概率。默认值0.05（计算方式：100/0.05=2000，即每格挡2000次（部分或完全格挡）攻击，盾牌损失1点耐久）"
  - key: "Death.SicknessLevel"
    default_value: 11
    desc_en: "Starting Character start gain sickness at spirit resurrection (1 min). Default: 11, -10 - character will have full time (10min) sickness at 1 level, maxplayerlevel+1 - character will not have sickness at any level"
    desc_cn: "角色在灵魂状态复活时开始获得虚弱状态的等级阈值（基础虚弱时长为1分钟）。默认值11；值为-10时，1级角色复活会获得满时长（10分钟）的虚弱；值为最大玩家等级+1时，任何等级角色复活都不会获得虚弱"
  - key: "Death.CorpseReclaimDelay.PvP"
    default_value: 1
    desc_en: "Enabled/disabled increase corpse reclaim delay at often PvP deaths. Default: 1 (enabled), 0 (disabled)"
    desc_cn: "是否启用因频繁PvP死亡而增加尸体回收延迟的机制。默认值1（启用），0（禁用）"
  - key: "Death.CorpseReclaimDelay.PvE"
    default_value: 1
    desc_en: "Enabled/disabled increase corpse reclaim delay at often PvP/PvE deaths. Default: 1 (enabled), 0 (disabled)"
    desc_cn: "是否启用因频繁PvE死亡而增加尸体回收延迟的机制。默认值1（启用），0（禁用）"
  - key: "Death.Bones.World"
    default_value: 1
    desc_en: "Enabled/disabled creating bones instead corpse at resurrection (in normal zones/instacnes, or battleground). Default: 1 (enabled), 0 (disabled)"
    desc_cn: "在常规区域/副本中复活时，是否创建骨头而非尸体。默认值1（启用），0（禁用）"
  - key: "Death.Bones.Battleground"
    default_value: 1
    desc_en: "Enabled/disabled creating bones instead corpse at resurrection (in normal zones/instacnes, or battleground). Default: 1 (enabled), 0 (disabled)"
    desc_cn: "在战场中复活时，是否创建骨头而非尸体。默认值1（启用），0（禁用）"
  - key: "Death.Ghost.RunSpeed.World"
    default_value: 1.0
    desc_en: "Modifies the speed of player's ghosts, removed upon reviving, not permanent/saved, in non-BG and BG maps. Default: 1.0 (normal speed)"
    desc_cn: "修改玩家灵魂在非战场地图中的移动速度，该效果在复活后移除，非永久/保存属性。默认值1.0（正常速度）"
  - key: "Death.Ghost.RunSpeed.Battleground"
    default_value: 1.0
    desc_en: "Modifies the speed of player's ghosts, removed upon reviving, not permanent/saved, in non-BG and BG maps. Default: 1.0 (normal speed)"
    desc_cn: "修改玩家灵魂在战场地图中的移动速度，该效果在复活后移除，非永久/保存属性。默认值1.0（正常速度）"
- group_name: BATTLEGROUND CONFIG
  group_items:
  - key: "Battleground.CastDeserter"
    default_value: 1
    desc_en: "Cast Deserter spell at player who leave battleground in progress. Default: 1 (enable), 0 (disable)"
    desc_cn: "对在战场进行过程中离开的玩家施放“逃兵”法术（即添加逃兵debuff）。默认值1（启用），0（禁用）"
  - key: "Battleground.QueueAnnouncer.Join"
    default_value: 0
    desc_en: "Enable queue announcer posting to chat at join. Default: 0 (not send), 1 (send to joined player only), 2 (send to all players)"
    desc_cn: "启用战场排队公告功能，在玩家加入排队时发送聊天公告。默认值0（不发送）；1（仅发送给加入排队的玩家）；2（发送给所有玩家）"
  - key: "Battleground.QueueAnnouncer.Start"
    default_value: 0
    desc_en: "Enable queue announcer posting to chat at BG start. Default: 0 (disable), 1 (enable)"
    desc_cn: "启用战场排队公告功能，在战场开始时发送聊天公告。默认值0（禁用），1（启用）"
  - key: "Battleground.ScoreStatistics"
    default_value: 0
    desc_en: "Enable Battleground scores storage in database. Default: 0 - (Disabled), 1 - (Enabled)"
    desc_cn: "是否启用战场分数统计并存储到数据库中。默认值0（禁用），1（启用）"
  - key: "Battleground.InvitationType"
    default_value: 0
    desc_en: "Set Battleground invitation type. Default: 0 (normal - invite as much players to bg as possible, don't bother with ballance), 1 (Experimental - don't allow to invite much more players of one faction)"
    desc_cn: "设置战场邀请类型。默认值0（普通模式：尽可能邀请玩家进入战场，不考虑阵营平衡）；1（实验模式：不允许邀请过多同一阵营的玩家）"
  - key: "BattleGround.PrematureFinishTimer"
    default_value: 300000
    desc_en: "The time to end the bg if there are less than MinPlayersPerTeam on one side in milliseconds. Default: 300000 (5 minutes), 0 - disable (not recommended)"
    desc_cn: "若某一阵营的玩家数量低于每队最低人数，战场将在该时长后提前结束（单位为毫秒）。默认值300000（5分钟）；值为0时禁用该功能（不推荐）"
  - key: "BattleGround.PremadeGroupWaitForMatch"
    default_value: 0
    desc_en: "The time in which premade group of 1 faction waits in BG Queue for premade group of other faction. Default: 0 - disable premade group matches (group always added to bg team in normal way), 1800000 (30 minutes)"
    desc_cn: "单一阵营的预制队伍在战场排队时，等待另一阵营预制队伍匹配的时长。默认值0（禁用预制队伍匹配，队伍始终以常规方式加入战场）；值为1800000时表示等待30分钟"
- group_name: OUTDOOR PVP CONFIG
  group_items:
  - key: "OutdoorPvp.SIEnabled"
    default_value: 1
    desc_en: "Enable Silithus Outdoor pvp. Default: 1 (enable), 0 (disable)"
    desc_cn: "是否启用希利苏斯野外PvP玩法。默认值1（启用），0（禁用）"
  - key: "OutdoorPvp.EPEnabled"
    default_value: 1
    desc_en: "Enable Eastern Plaguelands Outdoor pvp. Default: 1 (enable), 0 (disable)"
    desc_cn: "是否启用东瘟疫之地野外PvP玩法。默认值1（启用），0（禁用）"
- group_name: MEETING STONE LFG CONFIG
  group_items:
  - key: "LFG.Matchmaking"
    default_value: 0
    desc_en: "Check talents of players in queue when making a group. Default: 0 (disable - disregard talents, use class priorities, e.g. warrior - tank, paladin - healer) 1 (enable - set role based on talent tree that has more talent points)"
    desc_cn: "组队时检查排队玩家的天赋。默认值为0（禁用 - 忽略天赋，使用职业优先级，例如战士为坦克、圣骑士为治疗者）；值为1时启用，会根据拥有更多天赋点数的天赋树来设定角色定位。"
  - key: "LFG.MatchmakingTimer"
    default_value: 600
    desc_en: "The time (in seconds) before player in LFG queue stops using matchmaking to find group faster. Only works if matchmaking is enabled. Default: 600 (5 minutes)"
    desc_cn: "地下城查找器（LFG）队列中的玩家停止使用匹配机制以更快找到队伍的时间（以秒为单位）。该配置仅在匹配机制启用时生效。默认值为600秒（即5分钟）。"
- group_name: NETWORK CONFIG
  group_items:
  - key: "Network.Threads"
    default_value: 1
    desc_en: "Number of threads for network, recommend 1 thread per 1000 connections. Default: 1"
    desc_cn: "网络处理使用的线程数，建议每1000个连接使用1个线程。默认值为1。"
  - key: "Network.OutKBuff"
    default_value: -1
    desc_en: "The size of the output kernel buffer used ( SO_SNDBUF socket option, tcp manual ). Default: -1 (Use system default setting)"
    desc_cn: "所使用的输出内核缓冲区大小（对应SO_SNDBUF套接字选项，可参考TCP手册）。默认值为-1，表示使用系统默认设置。"
  - key: "Network.OutUBuff"
    default_value: 65536
    desc_en: "Userspace buffer for output. This is amount of memory reserved per each connection. Default: 65536"
    desc_cn: "输出用的用户态缓冲区，这是为每个连接预留的内存大小。默认值为65536字节。"
  - key: "Network.TcpNodelay"
    default_value: 1
    desc_en: "TCP Nagle algorithm setting. Default: 0 (enable Nagle algorithm, less traffic, more latency) 1 (TCP_NO_DELAY, disable Nagle algorithm, more traffic but less latency)"
    desc_cn: "TCP Nagle算法的设置项。默认值为0时启用Nagle算法，网络流量更少但延迟更高；值为1时启用TCP_NO_DELAY，禁用Nagle算法，网络流量更多但延迟更低。"
  - key: "Network.KickOnBadPacket"
    default_value: 0
    desc_en: "Kick player on bad packet format. Default: 0 - do not kick 1 - kick"
    desc_cn: "当检测到错误的数据包格式时是否踢出玩家。默认值为0，表示不踢出；值为1时表示踢出玩家。"
- group_name: CONSOLE, REMOTE ACCESS AND SOAP
  group_items:
  - key: "Console.Enable"
    default_value: 1
    desc_en: "Enable console. Default: 1 - on 0 - off"
    desc_cn: "是否启用控制台功能。默认值为1，表示开启；值为0时表示关闭。"
  - key: "Ra.Enable"
    default_value: 0
    desc_en: "Enable remote console. Default: 0 - off 1 - on"
    desc_cn: "是否启用远程控制台功能。默认值为0，表示关闭；值为1时表示开启。"
  - key: "Ra.IP"
    default_value: 0.0.0.0
    desc_en: "Default remote console ip address, use 0.0.0.0 for every address"
    desc_cn: "远程控制台的默认IP地址，设置为0.0.0.0表示允许从任意地址访问远程控制台。"
  - key: "Ra.Port"
    default_value: 3443
    desc_en: "Default remote console port. Default: 3443"
    desc_cn: "远程控制台的默认端口号。默认值为3443。"
  - key: "Ra.MinLevel"
    default_value: 3
    desc_en: "Minimum level that's required to login,3 by default. Default: 3 (Administrator)"
    desc_cn: "登录远程控制台所需的最低权限等级，默认值为3（管理员权限等级）。"
  - key: "Ra.Secure"
    default_value: 1
    desc_en: "Kick client on wrong pass. Default: 1 - on 0 - off"
    desc_cn: "当输入错误密码时是否踢出客户端。默认值为1，表示开启该功能；值为0时表示关闭。"
  - key: "Ra.Restricted"
    default_value: 1
    desc_en: "Not allow execute console level only commands remotly by RA. Default: 1 - on 0 - off"
    desc_cn: "是否禁止通过远程控制台（RA）执行仅控制台级别的命令。默认值为1，表示开启限制（不允许执行）；值为0时表示关闭限制（允许执行）。"
  - key: "SOAP.Enabled"
    default_value: 0
    desc_en: "Enable soap service. Default: 0 - off 1 - on"
    desc_cn: "是否启用SOAP服务。默认值为0，表示关闭；值为1时表示开启。"
  - key: "SOAP.IP"
    default_value: 127.0.0.1
    desc_en: "Bound SOAP service ip address, use 0.0.0.0 to access from everywhere. Default: 127.0.0.1"
    desc_cn: "SOAP服务绑定的IP地址，设置为0.0.0.0可允许从任意地址访问SOAP服务。默认值为127.0.0.1（仅本地可访问）。"
  - key: "SOAP.Port"
    default_value: 7878
    desc_en: "SOAP port. Default: 7878"
    desc_cn: "SOAP服务使用的端口号。默认值为7878。"
- group_name: CharDelete Configuration
  group_items:
  - key: "CharDelete.Method"
    default_value: 0
    desc_en: "Character deletion behavior. Default: 0  - Completely remove the character from the database 1  - Unlinking, the character gets unlinked from the account, the name gets freed up and appears as deleted ingame"
    desc_cn: "角色删除的行为模式。默认值为0，表示将角色从数据库中彻底移除；值为1时为解除关联模式，角色会与账号解除关联，角色名被释放，且在游戏内显示为已删除状态。"
  - key: "CharDelete.MinLevel"
    default_value: 0
    desc_en: "Character gets deleted by CharDelete.Method=0 when the character hasn't the specified level yet. Default: 0  - For all characters the specified mode will be used 1+ - Only for players which have reached the specified level will be deleted by the specified mode. the rest will be deleted by CharDelete.Method=0"
    desc_cn: "当角色未达到指定等级时，将按照CharDelete.Method=0的方式删除角色。默认值为0，表示所有角色都将使用指定的删除模式；值大于等于1时，仅达到该等级的角色会按指定模式删除，其余角色均按CharDelete.Method=0的方式删除。"
  - key: "CharDelete.KeepDays"
    default_value: 30
    desc_en: "Define the amount of days for which the characters are kept in the database before they will be removed. Default: 30 0  - Don't delete any characters, they stay in the database forever."
    desc_cn: "定义角色在数据库中保留的天数，超过该天数后角色将被移除。默认值为30天；值为0时表示不删除任何角色，角色将永久保留在数据库中。"
- group_name: METRICS CONFIGURATION -> Require core builded with BUILD_METRICS option
  group_items:
  - key: "Metric.Enable"
    default_value: 0
    desc_en: "Enable or disable metric logging. Default: 0  - Disabled(default) 1  - Enable"
    desc_cn: "启用或禁用指标日志记录功能（该功能要求核心编译时开启BUILD_METRICS选项）。默认值为0，表示禁用；值为1时表示启用。"
  - key: "Metric.Address"
    default_value: "127.0.0.1"
    desc_en: "IP / Hostname for the InfluxDB where measurements are stored. Default: '127.0.0.1'"
    desc_cn: "存储指标数据的InfluxDB数据库的IP地址/主机名。默认值为'127.0.0.1'（本地地址）。"
  - key: "Metric.Port"
    default_value: 8086
    desc_en: "Port for the InfluxDB where measurements are stored. Default: 8086"
    desc_cn: "存储指标数据的InfluxDB数据库使用的端口号。默认值为8086。"
  - key: "Metric.Database"
    default_value: "perfd"
    desc_en: "Database name for the InfluxDB where measurements are stored. Default: 'perfd'"
    desc_cn: "存储指标数据的InfluxDB数据库名称。默认值为'perfd'。"
  - key: "Metric.Username"
    default_value: ""
    desc_en: "Username of the InfluxDB where measurements are stored. Default: ''"
    desc_cn: "访问存储指标数据的InfluxDB数据库所需的用户名。默认值为空字符串，表示无需用户名。"
  - key: "Metric.Password"
    default_value: ""
    desc_en: "Password of the InfluxDB where measurements are stored. Default: ''"
    desc_cn: "访问存储指标数据的InfluxDB数据库所需的密码。默认值为空字符串，表示无需密码。"
- group_name: Dummy Configuration
  group_items:
  - key: "Dummy.Debug1"
    default_value: 0
    desc_en: ""
    desc_cn: "调试用配置项1，无额外描述信息，默认值为0。"
  - key: "Dummy.Debug2"
    default_value: 0
    desc_en: ""
    desc_cn: "调试用配置项2，无额外描述信息，默认值为0。"